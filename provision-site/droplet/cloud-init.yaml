#cloud-config
#
# User-data template for DigitalOcean droplet "server04" (Ubuntu 26.04 LTS).
# Flat stack: Apache 2.4 + PHP-FPM (the PHP 26.04 ships) + MariaDB + Composer
# + Drush launcher + Certbot, laid out for provision-site/toolkit
# (/var/www/[category]/[domain]/..., user rob, group www-data). No Docker.
#
# This file is a TEMPLATE. create-droplet.sh substitutes the placeholders
# (written @@...@@: droplet name, Rob's public keys, toolkit repo URL/ref) and writes the result
# to cloud-init.rendered.yaml (gitignored), which is what doctl sends.
#
# There are NO secrets here and none may be added: user-data is readable by
# anyone on the droplet via the metadata service (curl 169.254.169.254).
# The MariaDB root password is set by Rob on first login (see first-login.sh).

hostname: "@@DROPLET_NAME@@"
manage_etc_hosts: true
timezone: Europe/London
locale: en_GB.UTF-8

# --- rob: the only login. Member of www-data so the toolkit's rob:www-data
# 750/640 permissions work. Password locked; sudo without password because
# there is no password to type (run `sudo passwd rob` later to change that).
users:
  - name: rob
    gecos: Rob Davis
    shell: /bin/bash
    groups: [sudo, www-data, adm]
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - "@@ROB_SSH_AUTHORIZED_KEYS@@"

# DO injects the account SSH key into root; disable_root neuters that entry
# and sshd below refuses root anyway.
disable_root: true
ssh_pwauth: false
ssh_deletekeys: true

# --- swap: 2 GB file for a 4 GB droplet (cloud-init's own swap module)
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

# --- packages
package_update: true
package_upgrade: true
package_reboot_if_required: false   # rebooted by power_state at the very end instead
packages:
  # base / hardening
  - ufw
  - fail2ban
  - unattended-upgrades
  - ca-certificates
  - curl
  - wget
  - git
  - unzip
  - zip
  - rsync
  - gnupg
  - jq
  - htop
  - ncdu
  - tree
  - vim
  - logrotate
  - python3-systemd   # fail2ban's journal backend
  # web stack (php-* metapackages resolve to the PHP version 26.04 ships)
  - apache2
  - php-fpm
  - php-cli
  - php-gd
  - php-mbstring
  - php-xml
  - php-curl
  - php-zip
  - php-intl
  - php-opcache
  - php-mysql
  - php-apcu
  - mariadb-server
  - mariadb-client
  - certbot
  - python3-certbot-apache

write_files:
  # sshd hardening: keys only, no root, only rob. Drop-in beats editing
  # sshd_config and survives package upgrades.
  - path: /etc/ssh/sshd_config.d/00-server04-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PermitEmptyPasswords no
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding yes
      MaxAuthTries 4
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowUsers rob

  # fail2ban: ssh jail. Ubuntu 24.04+ has no /var/log/auth.log unless rsyslog
  # is installed, so read the journal instead.
  - path: /etc/fail2ban/jail.local
    owner: root:root
    permissions: "0644"
    content: |
      [DEFAULT]
      backend = systemd
      bantime  = 1h
      findtime = 10m
      maxretry = 5
      ignoreip = 127.0.0.1/8 ::1

      [sshd]
      enabled = true
      mode    = aggressive

  # unattended-upgrades: security updates daily, autoclean, no auto-reboot
  # (Rob reboots when needrestart / /var/run/reboot-required says so).
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /etc/apt/apt.conf.d/52unattended-upgrades-server04
    owner: root:root
    permissions: "0644"
    content: |
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Mail "";

  # Prefer RAM over swap on a 4 GB box.
  - path: /etc/sysctl.d/99-server04-swap.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.swappiness = 10
      vm.vfs_cache_pressure = 50

  # PHP settings for Drupal 11. Staged here because the PHP version directory
  # (/etc/php/8.x/) is only known once PHP is installed; the provision script
  # copies it into fpm/conf.d and cli/conf.d.
  - path: /etc/php-drupal.ini.staged
    owner: root:root
    permissions: "0644"
    content: |
      ; Drupal 11 on server04 (installed by cloud-init as 99-drupal.ini)
      memory_limit = 256M
      upload_max_filesize = 64M
      post_max_size = 64M
      max_execution_time = 120
      max_input_vars = 3000
      date.timezone = Europe/London
      expose_php = Off
      opcache.enable = 1
      opcache.memory_consumption = 192
      opcache.interned_strings_buffer = 16
      opcache.max_accelerated_files = 20000
      opcache.validate_timestamps = 1
      opcache.revalidate_freq = 60
      apc.shm_size = 64M
      apc.enable_cli = 0

  # Apache hardening drop-in.
  - path: /etc/apache2/conf-available/zz-server04-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      ServerTokens Prod
      ServerSignature Off
      TraceEnable Off
      Header always set X-Content-Type-Options "nosniff"
      # Never serve Drupal's private bits or dotfiles if a vhost forgets.
      <DirectoryMatch "/\.(git|env)">
          Require all denied
      </DirectoryMatch>

  # The provisioning script proper. Runs once from runcmd as root; logs to
  # /var/log/server04-provision.log. Idempotent where it is cheap to be.
  - path: /usr/local/sbin/server04-provision.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      # server04 first-boot provisioning (called by cloud-init runcmd).
      set -euo pipefail
      # cloud-init runs runcmd without HOME; Composer refuses to run without it.
      export HOME=/root COMPOSER_HOME=/root/.config/composer COMPOSER_ALLOW_SUPERUSER=1
      export DEBIAN_FRONTEND=noninteractive
      TOOLKIT_REPO_URL="@@TOOLKIT_REPO_URL@@"
      TOOLKIT_REPO_REF="@@TOOLKIT_REPO_REF@@"
      COMPOSER_DIR=/var/www/tools/dev/phpcomposer

      log() { echo "[provision $(date -u +%H:%M:%S)] $*"; }

      PHPV=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
      log "PHP ${PHPV} detected"

      # --- PHP: Drupal ini for fpm and cli
      for sapi in fpm cli; do
          install -m 0644 /etc/php-drupal.ini.staged "/etc/php/${PHPV}/${sapi}/conf.d/99-drupal.ini"
      done

      # --- Apache: event MPM talking to PHP-FPM over proxy_fcgi
      # mod_php is not installed (no libapache2-mod-php), so these are no-ops
      # on a clean box; kept so a rebuild from a drifted image still ends up on FPM.
      a2dismod -q "php${PHPV}" 2>/dev/null || true
      a2dismod -q mpm_prefork 2>/dev/null || true
      a2enmod -q mpm_event proxy_fcgi setenvif rewrite headers expires ssl
      a2enconf -q "php${PHPV}-fpm" zz-server04-hardening
      apache2ctl configtest
      systemctl enable --now apache2 "php${PHPV}-fpm" mariadb
      systemctl restart "php${PHPV}-fpm" apache2
      log "Apache + php${PHPV}-fpm + MariaDB running"

      # --- Firewall
      ufw --force reset >/dev/null
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp comment 'SSH'
      ufw allow 80/tcp comment 'HTTP'
      ufw allow 443/tcp comment 'HTTPS'
      ufw --force enable
      log "ufw enabled (22/80/443)"

      # --- sshd: check the drop-in parses, then reload
      sshd -t
      systemctl restart ssh
      log "sshd hardened"

      # --- fail2ban, unattended-upgrades, sysctl, time sync
      systemctl enable --now fail2ban
      systemctl enable --now unattended-upgrades
      sysctl --system >/dev/null
      timedatectl set-ntp true
      log "fail2ban, unattended-upgrades, ntp on"

      # --- /var/www owned by rob:www-data (toolkit convention). setgid so new
      #     files inherit group www-data. 000-default (/var/www/html) stays as
      #     the catch-all vhost for requests that match no site.
      mkdir -p /var/www/tools/dev "${COMPOSER_DIR}"
      chown -R rob:www-data /var/www
      chmod 2750 /var/www /var/www/tools /var/www/tools/dev "${COMPOSER_DIR}"

      # --- Composer: official installer, signature-checked, into the path
      #     create_release.sh expects (/var/www/tools/dev/phpcomposer/composer.phar)
      EXPECTED_SIG=$(curl -fsSL https://composer.github.io/installer.sig)
      curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
      ACTUAL_SIG=$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")
      if [ "${EXPECTED_SIG}" != "${ACTUAL_SIG}" ]; then
          log "ERROR: composer installer signature mismatch"; rm -f /tmp/composer-setup.php; exit 1
      fi
      php /tmp/composer-setup.php --quiet --install-dir="${COMPOSER_DIR}" --filename=composer.phar
      rm -f /tmp/composer-setup.php
      chown rob:www-data "${COMPOSER_DIR}/composer.phar"
      chmod 0755 "${COMPOSER_DIR}/composer.phar"
      ln -sfn "${COMPOSER_DIR}/composer.phar" /usr/local/bin/composer
      log "Composer $(composer --version --no-ansi 2>/dev/null | head -1)"

      # --- Drush launcher (global `drush` that defers to the site's vendor/bin/drush).
      #     The launcher project is archived; the toolkit mostly uses ./drush in
      #     each release, so a download failure is a warning, not fatal.
      if curl -fsSL https://github.com/drush-ops/drush-launcher/releases/latest/download/drush.phar -o /usr/local/bin/drush; then
          chmod 0755 /usr/local/bin/drush
          log "Drush launcher installed"
      else
          rm -f /usr/local/bin/drush
          log "WARNING: Drush launcher download failed; use ./drush inside each release"
      fi

      # --- Toolkit scripts: public repo -> /home/rob/scripts, then install.sh
      #     puts them on PATH as deploy, create_release, ... (no secrets involved)
      sudo -u rob -H git clone --quiet --depth 1 --branch "${TOOLKIT_REPO_REF}" "${TOOLKIT_REPO_URL}" /home/rob/infrastructure
      install -d -o rob -g rob -m 0755 /home/rob/scripts
      cp /home/rob/infrastructure/provision-site/toolkit/*.sh /home/rob/scripts/
      chown rob:rob /home/rob/scripts/*.sh
      chmod 0750 /home/rob/scripts/*.sh
      bash /home/rob/scripts/install.sh >/dev/null
      log "Toolkit installed to /home/rob/scripts and /usr/local/bin"

      chown -R rob:rob /home/rob
      log "DONE. Next: ssh rob@<ip> and run ~/first-login.sh"

  # What Rob runs on first login: the one step that needs a secret.
  - path: /home/rob/first-login.sh
    owner: rob:rob
    permissions: "0755"
    defer: true   # written in the final stage, after user rob exists
    content: |
      #!/bin/bash
      # server04 first login: the steps cloud-init must not do because they
      # involve secrets or judgement. Safe to re-run.
      set -euo pipefail
      echo "== 1. MariaDB: set root password, drop test db/anonymous users =="
      echo "   (root currently authenticates via unix_socket, i.e. only via sudo)"
      sudo mariadb-secure-installation
      echo
      echo "== 2. Pending reboot? =="
      if [ -f /var/run/reboot-required ]; then
          echo "   yes: sudo reboot when convenient"; else echo "   no"; fi
      echo
      echo "== 3. Where things are =="
      echo "   toolkit:  ~/scripts (also on PATH: deploy, create_release, site_status ...)"
      echo "   sites:    /var/www/[category]/[domain]/   (rob:www-data)"
      echo "   composer: /var/www/tools/dev/phpcomposer/composer.phar -> /usr/local/bin/composer"
      echo "   logs:     /var/log/server04-provision.log, /var/log/cloud-init-output.log"
      echo
      echo "== 4. Optional hardening after this =="
      echo "   sudo passwd rob && sudo sed -i 's/NOPASSWD://' /etc/sudoers.d/90-cloud-init-users"
      echo "   (gives sudo a password prompt; keep the NOPASSWD line if you prefer not)"

  - path: /etc/motd
    owner: root:root
    permissions: "0644"
    content: |

      server04 - Ubuntu 26.04 LTS - Apache/PHP-FPM/MariaDB flat stack (no Docker)
      Sites live in /var/www/[category]/[domain]; toolkit in ~/scripts and on PATH.
      First time here? Run ~/first-login.sh

runcmd:
  - [bash, -o, pipefail, -c, "/usr/local/sbin/server04-provision.sh 2>&1 | tee /var/log/server04-provision.log"]

final_message: "server04 cloud-init finished after $UPTIME seconds (see /var/log/server04-provision.log)"

# Reboot once at the very end if the kernel/libc upgrade asked for it, so the
# first SSH session lands on a clean box.
power_state:
  mode: reboot
  timeout: 60
  condition: "test -f /var/run/reboot-required"
